services:
  mongodb:
    image: mongo:latest
    container_name: fitlife-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
    ports:
      - "4000:4000"
  
  vault:
    image: hashicorp/vault:latest
    container_name: fitlife-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: vault server -dev

  authservice:
    build: ../AuthService
    ports:
      - "5000:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MongoDB__DatabaseName=AuthDB
      - MongoDB__CollectionName=UserCollection
      - Jwt__Key=this-is-a-development-secret-key-with-enough-length
      - Jwt__Issuer=FitLife
      - Jwt__Audience=FitLifeUsers
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=myroot
    depends_on:
      - mongodb

  userservice:
    build: ../UserService/UserService
    ports:
      - "5001:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MongoDB__DatabaseName=UserDB
      - MongoDB__CollectionName=UserCollection
      - Jwt__Key=this-is-a-development-secret-key-with-enough-length
      - Jwt__Issuer=FitLife
      - Jwt__Audience=FitLifeUsers
    depends_on:
      - mongodb

  classservice:
    build: ../ClassService/ClassService
    ports:
      - "5002:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MongoDB__DatabaseName=ClassDB
      - MongoDB__CollectionName=ClassCollection
    depends_on:
      - mongodb

  bookingservice:
    build: ../BookingService
    ports:
      - "5003:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MongoDB__DatabaseName=BookingDB
      - MongoDB__CollectionName=BookingCollection
      - UserService__BaseUrl=http://userservice:8080
      - ClassService__BaseUrl=http://classservice:8080
    depends_on:
      - mongodb
      - userservice
      - classservice

  adminservice:
    build: ../AdminService
    ports:
      - "5004:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MongoDB__DatabaseName=AdminDB
      - MongoDB__CollectionName=AdminCollection
    depends_on:
      - mongodb

  frontend:
    build: ../Frontend
    ports:
      - "3000:8080"
    depends_on:
      - authservice
      - userservice
      - classservice
      - bookingservice
      - adminservice

volumes:
  mongo_data:
